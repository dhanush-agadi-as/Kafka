spring:
  application:
    name: consumer

  cloud:
    function:
      definition: consumer;consumer2
    stream:
      function:
        definition: consumer;consumer2
      bindings:
        consumer-in-0:
          destination: topic2
          group: group1
        consumer2-in-0:
          destination: topic1
          group: group1
      kafka:
        binder:
          brokers: localhost:9092


