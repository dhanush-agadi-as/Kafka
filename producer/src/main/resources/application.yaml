spring:
  application:
    name: producer

  cloud:
    function:
      definition: sendRiderLocation;sendRiderStatus
    stream:
      function:
        definition: sendRiderLocation
      bindings:
        sendRiderLocation-out-0:
          destination: topic2
          content-type: application/json
        sendRiderStatus-out-0:
          destination: topic1
          content-type: application/json
      poller:
        fixed-delay: 5000
      Kafka:
        binder:
          brokers: localhost:9092


